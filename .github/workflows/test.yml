name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        go: ['1.23.x', 'stable']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: test -z "$(gofmt -l sim examples cmd)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: ./scripts/smoke.sh
